<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MeetFree</title><link rel="stylesheet" href="style.css"><script src="/socket.io/socket.io.js"></script></head><body>
<div id="landing" class="center"><div class="card"><div class="logo">Meet<span>Free</span></div><p>Simple browser video meetings — no account required.</p><input id="name" placeholder="Your name" maxlength="40"><input id="room" placeholder="Room code (or leave blank)"><button id="join">Join meeting</button><p class="small">Works on Chrome, Edge, Firefox and Safari. Use HTTPS on Render.</p></div></div>
<div id="app" hidden><header><div class="logo">Meet<span>Free</span></div><div class="roominfo">Room: <b id="roomLabel"></b> <button class="icon" id="copy">Copy invite</button></div><button class="icon" id="leave">Leave</button></header><main><section id="stage"><div id="grid"></div><div id="empty" class="empty">Connecting…</div></section><aside id="side"><div class="tabs"><button class="tab active" data-tab="chat">Chat</button><button class="tab" data-tab="people">People</button></div><div id="chatPane"><div id="messages"></div><div class="chatbox"><input id="chatInput" placeholder="Send a message"><button id="send">➤</button></div></div><div id="peoplePane" hidden><div id="people"></div></div></aside></main><footer><button id="mic" class="control">🎙️ <span>Mute</span></button><button id="cam" class="control">📹 <span>Camera</span></button><button id="share" class="control">🖥️ <span>Share screen</span></button><button id="record" class="control">⏺️ <span>Record</span></button><button id="hand" class="control">✋ <span>Raise hand</span></button><button id="react" class="control">😀 <span>React</span></button><button id="more" class="control">⋯ <span>More</span></button></footer></div>
<div id="reactMenu" class="popover" hidden>😀 👍 ❤️ 😂 🎉 👏 😮</div><script src="app.js"></script></body></html>
